<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1a12">
<title>Vic, Roquinho e Alya</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0d1a12; overflow: hidden;
    /* sem zoom, rolagem, seleção de texto ou menu ao segurar o dedo */
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #tela { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #topo {
    position: fixed; z-index: 4; display: flex; gap: 8px;
    top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right));
  }
  #topo button {
    font: bold 15px "Courier New", monospace; color: #fff;
    background: rgba(0, 0, 0, 0.45); border: 2px solid #ffffff88; border-radius: 8px;
    padding: 6px 10px; cursor: pointer;
  }
  #topo button:hover { background: rgba(0, 0, 0, 0.65); }
  #tela-cheia { display: none; }

  /* ---------- controles de toque (só aparecem em celular/tablet) ---------- */
  #controles { display: none; }
  body.toque #controles { display: block; }
  body.toque.pode-tela-cheia #tela-cheia { display: inline-block; }
  .ctl {
    position: fixed; z-index: 3; display: flex; gap: 10px;
    bottom: calc(14px + env(safe-area-inset-bottom));
  }
  #dpad { left: calc(14px + env(safe-area-inset-left)); padding: 6px; margin: -6px; }
  #area-pulo { right: calc(14px + env(safe-area-inset-right)); }
  .bt {
    width: 66px; height: 66px; border-radius: 50%; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    font: bold 26px "Courier New", monospace; color: #fff;
    background: rgba(0, 0, 0, 0.35); border: 2px solid #ffffff99;
    pointer-events: none; /* o toque é tratado pelo container */
  }
  #bt-pular { width: 84px; height: 84px; font-size: 30px; pointer-events: auto; }
  #dpad[data-ativo~="esquerda"] .esq,
  #dpad[data-ativo~="direita"] .dir,
  #bt-pular.ativo { background: rgba(255, 255, 255, 0.4); }
  #girar {
    display: none; position: fixed; z-index: 2; left: 0; right: 0;
    top: calc(64px + env(safe-area-inset-top)); text-align: center;
    font: bold 14px "Courier New", monospace; color: #bff5c9; opacity: 0.85;
  }
  @media (orientation: portrait) {
    body.toque #girar { display: block; }
    body.toque .ctl { bottom: calc(40px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<canvas id="tela" width="320" height="192"></canvas>
<div id="topo">
  <button id="tela-cheia" type="button">⛶</button>
  <button id="som" type="button">🔊 Som</button>
</div>
<div id="girar">↻ Vire o celular para jogar maior</div>
<div id="controles">
  <div id="dpad" class="ctl"><div class="bt esq">◀</div><div class="bt dir">▶</div></div>
  <div id="area-pulo" class="ctl"><div id="bt-pular" class="bt">▲</div></div>
</div>
<script>
// ==== sprites.js ====
(function (J) {
  // Sprites em pixel art. '.' = transparente. Todos olham para a DIREITA.

  // ---------- Vic ----------
  const VIC_PALETA = {
    K: '#2b1d14', // contorno
    R: '#5a3b26', // raiz escura do cabelo
    Y: '#f2d36b', // loiro
    S: '#f1c6a0', // pele
    E: '#2b1d14', // olho
    P: '#e08a8a', // bochecha/boca
    T: '#ef7b6c', // blusa coral
    D: '#3d5a8a', // short jeans
    B: '#6b4428', // botinhas
  };
  const VIC_TRONCO = [
    '....KKKK....',
    '..KKRRRRK...',
    '.KRRRRRRRK..',
    '.KYRRRRYYK..',
    'KYYYYSSSSK..',
    'KYYYSSSESK..',
    'KYYYSSSSSK..',
    'KYYYSSPSK...',
    'KYYYYKSSK...',
    'KYYYKTTTK...',
    'KYYKTTTTTK..',
    '.KYKTTTTSK..',
    '..KKTTTTSK..',
    '...KTTTTK...',
  ];
  const vic = (pernas) => ({ linhas: VIC_TRONCO.concat(pernas), paleta: VIC_PALETA });

  const VIC_PARADO = [
    '...KDDDDK...',
    '...KDDKDDK..',
    '...KSK.KSK..',
    '...KSK.KSK..',
    '..KBBK.KBBK.',
    '..KKKK.KKKK.',
  ];
  const VIC_PASSO = [
    '...KDDDDK...',
    '..KDDKKDDK..',
    '..KSK..KSK..',
    '.KSK....KSK.',
    'KBBK....KBBK',
    'KKKK....KKKK',
  ];
  const VIC_JUNTA = [
    '...KDDDDK...',
    '...KDDDDK...',
    '....KSSK....',
    '....KSSK....',
    '...KBBBBK...',
    '...KKKKKK...',
  ];
  const VIC_PULO = [
    '...KDDDDK...',
    '...KDDDDDK..',
    '...KSKKSK...',
    '..KBBKBBK...',
    '..KKKKKKK...',
    '............',
  ];

  // ---------- Gatos ----------
  const GATO_PERNAS = {
    parado: ['..KCK.KCK.KCK.', '..KK..KK..KK..'],
    passo: ['.KCK..KCK.KCK.', '.KK...KK...KK.'],
    junta: ['...KCKKCK..KCK', '...KK.KK...KK.'],
  };
  const gato = (corpo, pernas, cor, paleta) => ({
    linhas: corpo.concat(GATO_PERNAS[pernas].map((l) => l.replace(/C/g, cor))),
    paleta,
  });

  const ROQ_CORPO = [
    '.........KK.KK',
    'K........KBKBK',
    'BK.......KBBBK',
    '.BK.....KBGBGK',
    '.BKKKKKKKBBBPK',
    '..KBHHHBBBBBK.',
    '..KBBBBBBBBK..',
  ];
  const ROQ_PALETA = { K: '#0b0b0f', B: '#26262e', H: '#44444f', G: '#d7e64a', P: '#e98aa0' };

  const ALYA_CORPO = [
    '.........KK.KK',
    'K........KOKWK',
    'OK.......KOOWK',
    '.OK.....KWGWGK',
    '.WKKKKKKKWWWPK',
    '..KWOOOWWWWWK.',
    '..KWOOWWWWWK..',
  ];
  const ALYA_PALETA = { K: '#3a2a1a', W: '#fbf8ef', O: '#f0b44a', G: '#2f6a3a', P: '#e98aa0' };

  // ---------- Onça (20x12) ----------
  const ONCA_PALETA = {
    K: '#3a2614', // contorno
    P: '#e0a43a', // pelo
    M: '#5a3b1a', // pintas
    C: '#f6e3b0', // barriga e focinho
    E: '#2b1d14', // olho
    N: '#8a4a3a', // nariz
    W: '#ffffff', // branco do olho (assustada)
  };
  const ONCA_CORPO = [
    '.PK.KKKKKKKKKPPEPPEK',
    '.PKKPPMPPMPPKPPPCCNK',
    '..KPMPPPMPPMPKPCCCK.',
    '..KPPPMPPPPPPPKKKK..',
    '..KPMPPPMPPMPPPK....',
    '..KCCCCCCCCCCCCK....',
  ];
  const ONCA_CABECA = [
    '..............K..K..',
    '.............KPK.KPK',
    'K............KPPKPPK',
    'PK..........KPPPPPPK',
  ];
  const ONCA_CABECA_ASSUSTADA = [
    '....................',
    '..............KK.KK.',
    'K............KPPKPPK',
    'PK..........KPWWPWWK',
  ];
  const ONCA_PERNAS = {
    a: ['..KPK.KPK..KPK.KPK..', '..KK..KK...KK..KK...'],
    b: ['.KPK..KPK.KPK..KPK..', '.KK...KK..KK...KK...'],
  };
  const onca = (cabeca, pernas, assustada) => {
    const corpo = ONCA_CORPO.slice();
    if (assustada) corpo[0] = '.PK.KKKKKKKKKPWEPWEK';
    return { linhas: cabeca.concat(corpo, ONCA_PERNAS[pernas]), paleta: ONCA_PALETA };
  };

  // ---------- Itens ----------
  const ACAI = {
    linhas: ['..G...', '..GG..', '.AAA..', 'AALAA.', 'AAAAA.', '.AAA..'],
    paleta: { G: '#2f7a4a', A: '#5b2a6e', L: '#c79ad6' },
  };
  const FRUTA = {
    linhas: ['...G..', '..GG..', '.OOOO.', 'OOLOOO', 'OOOOOO', '.OOOO.'],
    paleta: { G: '#2f7a4a', O: '#f08a2e', L: '#ffd08a' },
  };
  const MASTRO = '.P......';
  const BANDEIRA_PALETA = { P: '#d9d2c3', T: '#f2d36b', F: '#3fa65a', Y: '#f2d36b', G: '#8a8a8a', K: '#3a2614' };
  const BANDEIRA_ERGUIDA = {
    linhas: ['TT......', '.PFFFFF.', '.PFFYFF.', '.PFFFF..', '.PFFF...']
      .concat(Array(10).fill(MASTRO), ['KPK.....']),
    paleta: BANDEIRA_PALETA,
  };
  const BANDEIRA_ABAIXADA = {
    linhas: ['TT......'].concat(Array(10).fill(MASTRO),
      ['.PGGG...', '.PGGGG..', '.PGGGG..', '.PGG....', 'KPK.....']),
    paleta: BANDEIRA_PALETA,
  };
  const CORACAO = ['.CC.CC.', 'CLCCCCC', 'CCCCCCC', '.CCCCC.', '..CCC..', '...C...'];

  J.sprites = {
    vic: {
      parado: vic(VIC_PARADO),
      andando: [vic(VIC_PASSO), vic(VIC_JUNTA)],
      pulando: vic(VIC_PULO),
    },
    roquinho: {
      parado: gato(ROQ_CORPO, 'parado', 'B', ROQ_PALETA),
      andando: [gato(ROQ_CORPO, 'passo', 'B', ROQ_PALETA), gato(ROQ_CORPO, 'junta', 'B', ROQ_PALETA)],
    },
    alya: {
      parado: gato(ALYA_CORPO, 'parado', 'W', ALYA_PALETA),
      andando: [gato(ALYA_CORPO, 'passo', 'W', ALYA_PALETA), gato(ALYA_CORPO, 'junta', 'W', ALYA_PALETA)],
    },
    onca: {
      andando: [onca(ONCA_CABECA, 'a', false), onca(ONCA_CABECA, 'b', false)],
      fugindo: onca(ONCA_CABECA_ASSUSTADA, 'b', true),
    },
    acai: ACAI,
    fruta: FRUTA,
    bandeira: { abaixada: BANDEIRA_ABAIXADA, erguida: BANDEIRA_ERGUIDA },
    coracao: {
      cheio: { linhas: CORACAO, paleta: { C: '#e05a6a', L: '#ffb3bd' } },
      vazio: { linhas: CORACAO, paleta: { C: '#5a3b3b', L: '#6e4a4a' } },
    },
  };

  J.desenharSprite = function (ctx, sprite, x, y, { espelhar = false, escala = 1 } = {}) {
    const ox = Math.round(x);
    const oy = Math.round(y);
    const largura = sprite.linhas[0].length;
    sprite.linhas.forEach((linha, lin) => {
      for (let col = 0; col < linha.length; col++) {
        const ch = linha[col];
        if (ch === '.') continue;
        const c = espelhar ? largura - 1 - col : col;
        ctx.fillStyle = sprite.paleta[ch];
        ctx.fillRect(ox + c * escala, oy + lin * escala, escala, escala);
      }
    });
  };
})(globalThis.Jogo = globalThis.Jogo || {});

// ==== fisica.js ====
(function (J) {
  J.TILE = 16;
  J.GRAVIDADE = 900;      // px/s²
  J.VEL_ANDAR = 90;       // px/s
  J.VEL_PULO = 300;       // px/s
  J.VEL_QUEDA_MAX = 400;  // px/s
  J.DT_MAX = 1 / 30;      // s

  const EPS = 1e-6;
  const tileDe = (px) => Math.floor(px / J.TILE);

  J.colide = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  J.alturaMaxPulo = () => (J.VEL_PULO * J.VEL_PULO) / (2 * J.GRAVIDADE);

  function colunaTemSolido(fase, col, y, h) {
    for (let lin = tileDe(y); lin <= tileDe(y + h - EPS); lin++) if (fase.solido(col, lin)) return true;
    return false;
  }
  function linhaTemSolido(fase, lin, x, w) {
    for (let col = tileDe(x); col <= tileDe(x + w - EPS); col++) if (fase.solido(col, lin)) return true;
    return false;
  }

  J.moverCorpo = function (corpo, fase, dt) {
    const T = J.TILE;
    corpo.vy = Math.min(corpo.vy + J.GRAVIDADE * dt, J.VEL_QUEDA_MAX);
    const passos = Math.max(1, Math.ceil(Math.max(Math.abs(corpo.vx * dt), Math.abs(corpo.vy * dt)) / (T / 2)));
    const sub = dt / passos;
    let noChao = false;
    let bateuParede = false;

    for (let i = 0; i < passos; i++) {
      // eixo X
      if (corpo.vx !== 0) {
        corpo.x += corpo.vx * sub;
        if (corpo.vx > 0) {
          const col = tileDe(corpo.x + corpo.w - EPS);
          if (colunaTemSolido(fase, col, corpo.y, corpo.h)) { corpo.x = col * T - corpo.w; bateuParede = true; }
        } else {
          const col = tileDe(corpo.x);
          if (colunaTemSolido(fase, col, corpo.y, corpo.h)) { corpo.x = (col + 1) * T; bateuParede = true; }
        }
      }
      // eixo Y
      if (corpo.vy !== 0) {
        corpo.y += corpo.vy * sub;
        if (corpo.vy > 0) {
          const lin = tileDe(corpo.y + corpo.h - EPS);
          if (linhaTemSolido(fase, lin, corpo.x, corpo.w)) { corpo.y = lin * T - corpo.h; corpo.vy = 0; noChao = true; }
        } else {
          const lin = tileDe(corpo.y);
          if (linhaTemSolido(fase, lin, corpo.x, corpo.w)) { corpo.y = (lin + 1) * T; corpo.vy = 0; }
        }
      }
    }
    return { noChao, bateuParede };
  };
})(globalThis.Jogo = globalThis.Jogo || {});

// ==== fase.js ====
(function (J) {
  // Legenda: . ar  # chão  = galho  T tronco  ~ água  a açaí  f fruta
  //          o onça  O onça chefona  B bandeirinha  S início  E estufa
  const LINHAS = 12;
  const SOLIDOS = '#=T';

  function construirMapa() {
    const grade = Array.from({ length: LINHAS }, () => Array(1200).fill('.'));
    let c = 0;
    const secoes = [];
    const por = (col, lin, ch) => { grade[lin][col] = ch; };
    const chao = (col, topo = 10) => { for (let l = topo; l < LINHAS; l++) por(col, l, '#'); };

    const P = {
      plano(n, { item = 'a', cada = 3, topo = 10 } = {}) {
        for (let i = 0; i < n; i++) {
          chao(c + i, topo);
          if (item && i % cada === 1) por(c + i, topo - 1, item);
        }
        c += n;
      },
      tronco(alt = 1) {
        P.plano(2, { item: null });
        chao(c);
        for (let k = 1; k <= alt; k++) por(c, 10 - k, 'T');
        por(c - 1, 9 - alt - 1, 'a'); por(c, 9 - alt - 2, 'a'); por(c + 1, 9 - alt - 1, 'a');
        c += 1;
        P.plano(3, { item: null });
      },
      degraus() {
        P.plano(3, { topo: 9, cada: 2 });
        P.plano(3, { item: 'f', topo: 8, cada: 2 });
        P.plano(3, { topo: 9, cada: 2 });
      },
      buraco(w = 3) {
        P.plano(2, { item: null });
        for (let i = 0; i < w; i++) por(c + i, 7, 'a');
        c += w;
        P.plano(2, { item: null });
      },
      galho() {
        P.plano(2, { item: null });
        P.plano(2, { item: null, topo: 9 }); // degrauzinho para alcançar o galho
        P.plano(2, { item: null });          // espaço para não bater a cabeça no galho
        const ini = c;
        P.plano(6, { item: null });
        for (let i = 0; i < 4; i++) { por(ini + i, 7, '='); por(ini + i, 6, i % 2 ? 'f' : 'a'); }
      },
      onca() {
        P.plano(12, { cada: 4 });
        por(c - 6, 9, 'o');
      },
      bandeira() {
        P.plano(6, { item: null });
        por(c - 3, 9, 'B');
      },
      rio(n) {
        // n ≡ 0 (mod 5): termina com 1 coluna de água antes da margem,
        // para o último galho não virar parede para quem volta pela margem.
        for (let i = 0; i < n; i++) {
          por(c + i, 10, '~'); por(c + i, 11, '~');
          if (i % 5 >= 1 && i % 5 <= 3) {
            por(c + i, 8, '=');
            if (i % 5 === 2) por(c + i, 7, i % 10 === 2 ? 'f' : 'a');
          }
        }
        c += n;
      },
      chefona() {
        P.bandeira(); // para recomeçar pertinho da chefona
        P.plano(4, { item: null });
        P.plano(24, { item: null });
        por(c - 12, 8, 'O');
        P.plano(6, { item: null });
      },
      estufa() {
        P.plano(30, { cada: 5 });
        P.plano(12, { item: null });
        por(c - 9, 9, 'E');
      },
    };

    // ---- Mata ----
    P.plano(8, { item: null }); por(3, 9, 'S');
    P.plano(10); P.tronco(1); P.plano(6); P.degraus(); P.onca(); P.buraco(2); P.plano(6);
    P.galho(); P.tronco(2); P.onca(); P.plano(8); P.buraco(3); P.degraus(); P.bandeira();
    P.plano(6); P.galho(); P.onca(); P.tronco(1); P.plano(10); P.buraco(3); P.plano(6);
    secoes.push({ ate: c, nome: 'mata' });

    // ---- Rio ----
    P.plano(6); P.rio(20); P.plano(8); P.onca(); P.plano(6); P.rio(25); P.plano(6);
    P.galho(); P.onca(); P.rio(15); P.plano(8); P.bandeira(); P.plano(6); P.tronco(2);
    P.onca(); P.plano(8); P.rio(20); P.plano(6);
    secoes.push({ ate: c, nome: 'rio' });

    // ---- Árvores gigantes e a chefona ----
    P.degraus(); P.galho(); P.onca(); P.tronco(2); P.buraco(3); P.galho(); P.degraus();
    P.onca(); P.tronco(1); P.bandeira(); P.galho(); // o tronco separa a onça da bandeirinha P.tronco(1); P.onca(); P.buraco(2);
    P.degraus(); P.plano(8); P.chefona();
    secoes.push({ ate: c, nome: 'gigantes' });

    // ---- Jardim Botânico ----
    P.estufa();
    secoes.push({ ate: c, nome: 'jardim' });

    return { mapa: grade.map((l) => l.slice(0, c).join('')), secoes };
  }

  const construido = construirMapa();
  J.MAPA_FASE = construido.mapa;
  J.SECOES = construido.secoes;

  J.secaoEm = function (xPixel) {
    const col = Math.floor(xPixel / J.TILE);
    const s = J.SECOES.find((sec) => col < sec.ate);
    return (s || J.SECOES[J.SECOES.length - 1]).nome;
  };

  J.carregarFase = function (linhas) {
    const T = J.TILE;
    const colunas = linhas[0].length;
    const tiles = linhas.map((l) => l.split(''));
    const fase = {
      colunas, linhas: linhas.length, tiles,
      coletaveis: [], oncas: [], bandeiras: [], inicio: { x: 0, y: 0 }, fim: null,
    };
    tiles.forEach((linha, lin) => linha.forEach((ch, col) => {
      const x = col * T, y = lin * T;
      if (ch === 'a' || ch === 'f') fase.coletaveis.push({ x: x + 3, y: y + 3, w: 10, h: 10, tipo: ch === 'a' ? 'acai' : 'fruta', pego: false });
      else if (ch === 'o' || ch === 'O') fase.oncas.push({ x, y, chefona: ch === 'O' });
      else if (ch === 'B') fase.bandeiras.push({ x, y, ativa: false });
      else if (ch === 'S') fase.inicio = { x, y };
      else if (ch === 'E') fase.fim = { x, y: (lin + 1) * T - 64, w: 48, h: 64 };
      else return;
      linha[col] = '.';
    }));
    fase.coletaveis.sort((a, b) => a.x - b.x);
    fase.bandeiras.sort((a, b) => a.x - b.x);
    fase.tile = (col, lin) => (lin >= 0 && lin < fase.linhas && col >= 0 && col < colunas ? tiles[lin][col] : '.');
    fase.solido = (col, lin) => {
      if (col < 0 || col >= colunas) return true;
      if (lin < 0 || lin >= fase.linhas) return false;
      return SOLIDOS.includes(tiles[lin][col]);
    };
    fase.perigo = (col, lin) => fase.tile(col, lin) === '~';
    return fase;
  };
})(globalThis.Jogo = globalThis.Jogo || {});

// ==== entidades.js ====
(function (J) {
  const HISTORICO_MAX = 60;
  const DIST_REAPARECER = 160;

  // ---------- Vic ----------
  // Folgas para o pulo: ↑ apertado um pouco antes de pousar ou logo depois de sair da beirada ainda vale.
  const FOLGA_ANTES = 0.12;
  const FOLGA_BEIRADA = 0.1;

  J.criarVic = (x, y) => ({
    x, y, w: 10, h: 20, vx: 0, vy: 0, noChao: false, olhandoDireita: true,
    coracoes: 3, invencivel: 0, animTempo: 0, bufferPulo: 0, coyote: 0,
  });

  J.atualizarVic = function (vic, entrada, fase, dt) {
    const dir = (entrada.direita ? 1 : 0) - (entrada.esquerda ? 1 : 0);
    vic.vx = dir * J.VEL_ANDAR;
    if (dir !== 0) vic.olhandoDireita = dir > 0;
    if (entrada.puloApertado) vic.bufferPulo = FOLGA_ANTES;

      seguradas.direita = false;

    });

      ler() {
        const r = {
          ...bordas,
          esquerda: seguradas.esquerda || tocando('esquerda'),
          direita: seguradas.direita || tocando('direita'),

(function (J) {

(function (J) {
  if (typeof document === 'undefined') return;
  const PASSO = 1 / 60;
  const canvas = document.getElementById('tela');
  const jogo = J.criarJogo();
  const entrada = J.criarEntrada(window);
  const render = J.criarRenderizador(canvas);
  const audio = J.criarAudio();
  J.jogoAtual = jogo; // para depuração no console
  const reajustar = () => render.ajustar();
  window.addEventListener('resize', reajustar);
  window.addEventListener('orientationchange', () => setTimeout(reajustar, 250));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', reajustar);

  // ---------- celular / tablet ----------
  const ativarToque = () => {
    if (J.modoToque) return;
    J.modoToque = true;
    document.body.classList.add('toque');
  };
  const ehCelular = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
    || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1); // iPad novo se diz "Mac"
  if ((window.matchMedia && matchMedia('(hover: none) and (pointer: coarse)').matches)
    || (ehCelular && navigator.maxTouchPoints > 0)) ativarToque();
  window.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') ativarToque(); }, true);
  entrada.ligarToque({
    dpad: document.getElementById('dpad'),
    pular: document.getElementById('bt-pular'),
    ignorar: '#topo',
  });

  // Tela cheia (Android); no iPhone o Safari não permite, então o botão fica escondido.
  const raiz = document.documentElement;
  const pedirTelaCheia = raiz.requestFullscreen || raiz.webkitRequestFullscreen;
  if (pedirTelaCheia) document.body.classList.add('pode-tela-cheia');
  document.getElementById('tela-cheia').addEventListener('click', async (e) => {
    e.currentTarget.blur();
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        await pedirTelaCheia.call(raiz);
        if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape').catch(() => {});
      }
    } catch (_) { /* navegador recusou: segue sem tela cheia */ }
    setTimeout(reajustar, 250);
  });

  const botaoSom = document.getElementById('som');
  const mostrarSom = (ligado) => { botaoSom.textContent = ligado ? '🔊 Som' : '🔇 Sem som'; };
  botaoSom.addEventListener('click', () => {
    audio.destravar();
    mostrarSom(audio.alternar());
    botaoSom.blur(); // devolve as setas para o jogo
    window.focus();
  });
  window.addEventListener('pointerdown', () => audio.destravar());
  window.addEventListener('touchend', () => audio.destravar()); // iPhone só libera o som no fim do toque

  J.aoEventos = (j, e) => {
    if (e.qualquerTecla) audio.destravar();
    if (e.alternarSom) mostrarSom(audio.alternar());
    for (const ev of j.eventos) audio.tocar(ev);
  };

  let anterior = performance.now();
  let acumulado = 0;
  function quadro(agora) {
    acumulado += Math.min((agora - anterior) / 1000, 0.25);
    anterior = agora;
    let passos = 0;
    if (acumulado >= PASSO) {
      let e = entrada.ler();
      while (acumulado >= PASSO && passos < 5) {
        J.atualizarJogo(jogo, e, PASSO);
        if (J.aoEventos) J.aoEventos(jogo, e);
        e = { ...e, puloApertado: false, qualquerTecla: false, alternarSom: false, toqueTela: false };
        acumulado -= PASSO;
        passos++;
      }
      if (passos === 5) acumulado = 0;
    }
    audio.atualizarMusica(jogo.tela);
    render.desenhar(jogo);
    requestAnimationFrame(quadro);
  }
  requestAnimationFrame(quadro);
})(globalThis.Jogo = globalThis.Jogo || {});
